[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remind-video"
version = "0.1.0"
description = "Inference for ReMind dynamic-memory video generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "CC-BY-NC-4.0 AND Apache-2.0 AND MIT"
license-files = [
    "LICENSE",
    "NOTICE",
    "docs/THIRD_PARTY_NOTICES.md",
    "docs/WEIGHTS_LICENSE.md",
    "LICENSES/*.txt",
]

[tool.setuptools]
py-modules = ["inference"]

[tool.setuptools.packages.find]
include = ["pipeline*", "prope*", "utils*", "wan*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
